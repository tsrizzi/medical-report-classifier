[project]
name = "triage-laudos"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "scikit-learn>=1.5,<2.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<2.0",
    "joblib>=1.4,<2.0",
    "prometheus-client>=0.20,<1.0",
    "onnx>=1.16,<2.0",
    "onnxruntime>=1.18,<2.0",
    "skl2onnx>=1.17,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
    "jupyter>=1.0,<2.0",
    "nbconvert>=7.16,<8.0",
    "ipykernel>=6.29,<7.0",
    "matplotlib>=3.9,<4.0",
    "seaborn>=0.13,<1.0",
    "httpx2>=2.12.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "airflow: requires apache-airflow installed locally (excluded from CI)",
]
